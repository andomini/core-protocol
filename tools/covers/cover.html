<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Core Protocol cover</title>
<style>
  @font-face { font-family: 'Orbitron'; src: url('../../public/fonts/orbitron-latin.woff2') format('woff2'); font-weight: 400 900; }
  html, body { margin: 0; background: #070b1a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Cover / thumbnail art in the game's neon style (spec §4). Query: ?w=800&h=800&title=0|1&seed=7
// No text when title=0 (Poki thumbnails must have no text or frames).
const q = new URLSearchParams(location.search);
const W = Number(q.get('w') || 800);
const H = Number(q.get('h') || 800);
const TITLE = q.get('title') === '1';
let seed = Number(q.get('seed') || 7);
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const c = document.getElementById('c');
c.width = W; c.height = H;
const g = c.getContext('2d');
const S = Math.min(W, H) / 800; // design scale

const COL = { cyan: '#22e5ff', magenta: '#ff2bd6', yellow: '#ffe14a', orange: '#ff5a2a', violet: '#a45bff', crimson: '#ff2d55', chain: '#b18cff', cryo: '#7fe3ff' };

function glow(color, blur) { g.shadowColor = color; g.shadowBlur = blur * S; }
function noGlow() { g.shadowBlur = 0; }
function poly(cx, cy, r, n, rot) {
  g.beginPath();
  for (let i = 0; i < n; i++) { const a = rot + (Math.PI * 2 * i) / n; const x = cx + r * Math.cos(a); const y = cy + r * Math.sin(a); i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.closePath();
}
function neonShape(cx, cy, r, n, rot, color, lw = 3) {
  for (const [w, a] of [[lw * 4, 0.18], [lw * 2, 0.35], [lw, 1]]) {
    g.save(); glow(color, 18); g.globalAlpha = a; g.strokeStyle = color; g.lineWidth = w * S; poly(cx, cy, r, n, rot); g.stroke(); g.restore();
  }
  g.save(); g.globalAlpha = 0.12; g.fillStyle = color; poly(cx, cy, r, n, rot); g.fill(); g.restore();
  g.save(); g.globalAlpha = 0.7; g.strokeStyle = color; g.lineWidth = 1.5 * S; poly(cx, cy, r * 0.5, n, rot); g.stroke(); g.restore();
}

async function draw() {
  try { await document.fonts.load('900 80px Orbitron'); } catch {}
  // Background: radial vignette + perspective-free neon grid.
  const bg = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);
  bg.addColorStop(0, '#0d1838'); bg.addColorStop(0.6, '#070b1a'); bg.addColorStop(1, '#03050d');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const step = 48 * S;
  for (let x = (W / 2) % step; x < W; x += step) { g.strokeStyle = 'rgba(31,107,255,0.13)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = (H / 2) % step; y < H; y += step) { g.strokeStyle = 'rgba(31,107,255,0.13)'; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  // Core position: a bit off-centre on wide covers so the title has room.
  const cx = W > H * 1.3 ? W * 0.7 : W / 2;
  const cy = TITLE && H > W * 1.2 ? H * 0.58 : H / 2 + (TITLE && W <= H * 1.3 ? 40 * S : 0);
  const R = 270 * S;
  // Range ring (dashed) and inner ring.
  g.save(); glow(COL.cyan, 10); g.strokeStyle = 'rgba(34,229,255,0.35)'; g.lineWidth = 2 * S; g.setLineDash([10 * S, 12 * S]);
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke(); g.restore();
  g.save(); g.strokeStyle = 'rgba(34,229,255,0.12)'; g.lineWidth = 1.5 * S; g.beginPath(); g.arc(cx, cy, R * 0.52, 0, Math.PI * 2); g.stroke(); g.restore();

  // Viruses around the core.
  const enemies = [];
  const kinds = [['magenta', 4, 18], ['magenta', 4, 18], ['yellow', 3, 15], ['orange', 4, 30], ['violet', 4, 18]];
  for (let i = 0; i < 40 && enemies.length < 18; i++) {
    const a = rnd() * Math.PI * 2;
    const d = R * (0.62 + rnd() * 0.6);
    const [col, n, r] = kinds[Math.floor(rnd() * kinds.length)];
    const x = cx + Math.cos(a) * d; const y = cy + Math.sin(a) * d;
    if (x < -40 || y < -40 || x > W + 40 || y > H + 40) continue;
    if (TITLE && W > H * 1.3 && x < W * 0.56) continue; // keep the title area clear
    if (TITLE && W <= H * 1.3 && y < H * 0.3) continue;
    if (enemies.some((o) => Math.hypot(o.x - x, o.y - y) < 70 * S)) continue;
    enemies.push({ x, y, col, n, r: r * S * (1.1 + rnd() * 0.4), rot: rnd() * 3 });
  }
  // Boss worm: a chain of red hexagons curling on one side.
  const worm = [];
  const wa = W > H * 1.3 ? 0.9 : 2.0; const wd = R * 0.9;
  for (let i = 0; i < 7; i++) {
    const t = i * 0.16;
    worm.push({ x: cx + Math.cos(wa + t) * (wd + i * 14 * S), y: cy + Math.sin(wa + t) * (wd + i * 14 * S), r: (46 - i * 4) * S });
  }

  // Tracers from the core to a few targets.
  const targets = enemies.slice(0, 6);
  for (const t of targets) {
    const dx = t.x - cx, dy = t.y - cy, L = Math.hypot(dx, dy);
    const sx = cx + (dx / L) * 70 * S, sy = cy + (dy / L) * 70 * S;
    const ex = cx + (dx / L) * (L * (0.55 + rnd() * 0.3)), ey = cy + (dy / L) * (L * (0.55 + rnd() * 0.3));
    g.save(); glow('#9ff8ff', 14); const gr = g.createLinearGradient(sx, sy, ex, ey); gr.addColorStop(0, 'rgba(159,248,255,0)'); gr.addColorStop(1, 'rgba(230,255,255,0.95)');
    g.strokeStyle = gr; g.lineWidth = 4 * S; g.beginPath(); g.moveTo(sx, sy); g.lineTo(ex, ey); g.stroke(); g.restore();
  }
  // Lightning chain between several viruses.
  const chain = [enemies[6]].filter(Boolean);
  while (chain.length < 4) {
    const last = chain[chain.length - 1];
    const next = enemies.filter((e) => !chain.includes(e) && !targets.includes(e)).sort((a, b) => Math.hypot(a.x - last.x, a.y - last.y) - Math.hypot(b.x - last.x, b.y - last.y))[0];
    if (!next || Math.hypot(next.x - last.x, next.y - last.y) > 230 * S) break;
    chain.push(next);
  }
  for (let i = 0; i + 1 < chain.length; i++) {
    const a = chain[i], b = chain[i + 1];
    for (const [lw, col, al] of [[9, COL.chain, 0.35], [3, '#ffffff', 0.95]]) {
      g.save(); glow(COL.chain, 16); g.globalAlpha = al; g.strokeStyle = col; g.lineWidth = lw * S; g.beginPath(); g.moveTo(a.x, a.y);
      for (let k = 1; k < 7; k++) { const f = k / 7; const nx = -(b.y - a.y), ny = b.x - a.x; const L = Math.hypot(nx, ny) || 1; const j = (rnd() - 0.5) * 30 * S;
        g.lineTo(a.x + (b.x - a.x) * f + (nx / L) * j, a.y + (b.y - a.y) * f + (ny / L) * j); }
      g.lineTo(b.x, b.y); g.stroke(); g.restore();
    }
  }
  // Enemies.
  for (const e of enemies) neonShape(e.x, e.y, e.r, e.n, e.rot, COL[e.col], 3);
  // A few frozen ones (icy tint).
  for (const e of enemies.slice(10, 13)) {
    g.save(); glow(COL.cryo, 26); g.globalAlpha = 0.35; g.fillStyle = COL.cryo; poly(e.x, e.y, e.r * 1.25, e.n, e.rot); g.fill(); g.restore();
    neonShape(e.x, e.y, e.r * 1.25, e.n, e.rot, COL.cryo, 2);
  }
  for (let i = worm.length - 1; i >= 0; i--) neonShape(worm[i].x, worm[i].y, worm[i].r, 6, 0.3 + i * 0.2, COL.crimson, i === 0 ? 4 : 3);
  // Pixel bursts (deaths).
  for (let b = 0; b < 5; b++) {
    const e = enemies[13 + b]; if (!e) break;
    for (let i = 0; i < 18; i++) { const a = rnd() * Math.PI * 2, d = (10 + rnd() * 50) * S; g.save(); glow(COL[e.col], 10); g.fillStyle = COL[e.col]; g.globalAlpha = 0.5 + rnd() * 0.5;
      const s = (3 + rnd() * 4) * S; g.fillRect(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d, s, s); g.restore(); }
  }
  // The core: layered glowing hexagons + bright centre + orbit ticks.
  const coreR = 80 * S;
  g.save(); const halo = g.createRadialGradient(cx, cy, 0, cx, cy, coreR * 3.2); halo.addColorStop(0, 'rgba(34,229,255,0.45)'); halo.addColorStop(1, 'rgba(34,229,255,0)');
  g.fillStyle = halo; g.beginPath(); g.arc(cx, cy, coreR * 3.2, 0, Math.PI * 2); g.fill(); g.restore();
  neonShape(cx, cy, coreR, 6, Math.PI / 6 + 0.15, COL.cyan, 5);
  neonShape(cx, cy, coreR * 0.62, 6, Math.PI / 6 - 0.2, COL.cyan, 3);
  g.save(); glow('#ffffff', 30); g.fillStyle = '#eaffff'; g.beginPath(); g.arc(cx, cy, coreR * 0.2, 0, Math.PI * 2); g.fill(); g.restore();
  g.save(); glow(COL.cyan, 12); g.strokeStyle = COL.cyan; g.lineWidth = 3 * S;
  for (let i = 0; i < 4; i++) { const a0 = i * Math.PI / 2 + 0.3; g.beginPath(); g.arc(cx, cy, coreR * 1.45, a0, a0 + 1.0); g.stroke(); }
  g.restore();

  if (TITLE) {
    const wide = W > H * 1.3;
    const size = (wide ? 110 : W < H ? 92 : 96) * S;
    const tx = wide ? W * 0.07 : W / 2;
    const ty = wide ? H * 0.36 : H * 0.14;
    g.textAlign = wide ? 'left' : 'center'; g.textBaseline = 'middle'; g.font = `900 ${size}px Orbitron`;
    const lines = ['CORE', 'PROTOCOL'];
    lines.forEach((t, i) => {
      const y = ty + i * size * 1.05;
      g.save(); glow(COL.cyan, 30); g.lineWidth = 10 * S; g.strokeStyle = 'rgba(3,5,13,0.9)'; g.strokeText(t, tx, y); g.restore();
      g.save(); g.globalAlpha = 0.6; g.fillStyle = '#ff1050'; g.fillText(t, tx + 4 * S, y); g.fillStyle = '#00f0ff'; g.fillText(t, tx - 4 * S, y); g.restore();
      g.save(); glow(COL.cyan, 24); g.fillStyle = '#eaffff'; g.fillText(t, tx, y); g.restore();
    });
  }
  document.body.dataset.ready = '1';
}
draw();
</script>
</body>
</html>
